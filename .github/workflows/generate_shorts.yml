name: Generate Shorts
# The cron string in the run title lets run_local.py --if-gh-missed find the run for its own slot
# (all six crons share this workflow; on 2026-10-25 another slot's run hid a missing one).
run-name: "Generate Shorts${{ github.event_name == 'schedule' && format(' [{0}]', github.event.schedule) || (inputs.campaign && format(' [{0}]', inputs.campaign)) || '' }}"

on:
  # GitHub starts scheduled runs late (4.6 h on 2026-10-25), so each cron fires ~6 h before its
  # campaign's publish slot in EDT (~7 h in EST; src/campaigns.py publish_slots_et, US Eastern).
  # The upload is scheduled with publishAt, so an early render still goes public at the slot.
  # Minutes avoid :00/:15/:30/:45, when GitHub's scheduler is busiest.
  # When a cron string changes, change it in CAMPAIGN / PUBLISH_SLOT below, WHOP_HANDOFF.md and
  # scripts/register_fallback_tasks.ps1 (--if-gh-missed) too.
  schedule:
    - cron: '42 16 * * *'   # milkxp     -> 18:45 ET (22:45 UTC EDT / 23:45 UTC EST)
    - cron: '42 17 * * *'   # milkxp     -> 19:45 ET (23:45 / 00:45)
    - cron: '57 17 * * *'   # markmanson -> 20:00 ET (00:00 / 01:00)
    - cron: '57 18 * * *'   # unpacked   -> 21:00 ET (01:00 / 02:00)
    - cron: '27 20 * * *'   # ladbible   -> 22:30 ET (02:30 / 03:30)
    - cron: '12 21 * * *'   # ladbible   -> 23:15 ET (03:15 / 04:15)
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Campaign profile (src/campaigns.py): friends | loveisblind | markmanson | loveandjustice | unpacked | youngla | tonyhawk | bilf | ladbible | milkxp'
        required: false
        default: 'loveisblind'
      video_file_id:
        description: 'Drive File ID — leave blank to auto-pick from videos/ folder'
        required: false
        default: ''
      episode_name:
        description: 'Episode name (e.g. friends_s01e01) — auto-detected if blank'
        required: false
        default: ''
      whisper_model:
        description: 'Whisper model: base (fast) | small (accurate) | medium (best)'
        required: false
        default: 'medium'

# Required GitHub Secrets:
#   GOOGLE_SERVICE_ACCOUNT_JSON  — full JSON of the service account key file
#   GEMINI_API_KEY               — from aistudio.google.com/app/apikey
#   GOOGLE_REFRESH_TOKEN         — run setup_oauth.py locally (covers Drive + YouTube)
#   GOOGLE_CLIENT_ID             — OAuth client ID
#   GOOGLE_CLIENT_SECRET         — OAuth client secret
#   HF_TOKEN                     — HuggingFace token (free) for pyannote diarization
# NOTE: refresh token auto-refreshes — no re-auth needed as long as workflow runs regularly

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # gh release download (campaign footage)
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1 libgles2 libegl1 fonts-noto-color-emoji   # emoji: edit-layer headline

      - name: Install ffmpeg
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          rm -rf ffmpeg-master-latest-linux64-gpl*

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-torch200-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          pip install --no-deps torch==2.0.0+cpu torchaudio==2.0.0+cpu --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.0.0+cpu\ntorchaudio==2.0.0+cpu\n' > /tmp/constraints.txt
          pip install -r requirements.txt -c /tmp/constraints.txt

      # Remotion caption layer (remotion/, render['captions_engine']). Every step here is
      # non-fatal: without Node / Remotion the pipeline burns the ASS captions instead.
      # node_modules (with Remotion's headless Chromium in node_modules/.remotion) is cached
      # whole on the lockfile, so a warm run skips npm ci and the browser download.
      - name: Setup Node (Remotion captions)
        id: node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'

      - name: Restore Remotion node_modules + Chromium
        id: rmcache
        if: steps.node.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: remotion/node_modules
          key: remotion-nm-${{ runner.os }}-node24.11.0-${{ hashFiles('remotion/package-lock.json') }}

      - name: Install Remotion
        id: rminstall
        if: steps.node.outcome == 'success' && steps.rmcache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 4
        working-directory: remotion
        run: |
          start=$(date +%s)
          npm ci --no-audit --no-fund
          echo "npm ci took $(( $(date +%s) - start ))s"
          start=$(date +%s)
          npx remotion browser ensure
          echo "browser ensure took $(( $(date +%s) - start ))s"

      # saved only after a complete install, so a half-finished one is never cached
      - name: Save Remotion node_modules + Chromium
        if: steps.rminstall.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: remotion/node_modules
          key: ${{ steps.rmcache.outputs.cache-primary-key }}

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: hf-whisper-${{ github.event.inputs.whisper_model || 'medium' }}-medium.en-pyannote-3.1-v2

      - name: Pre-download models
        run: python src/preload_models.py
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          WHISPER_MODEL: ${{ github.event.inputs.whisper_model || 'medium' }}
          WHISPER_TALK_MODEL: 'medium.en'

      - name: Write YouTube token
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -n "$YT_TOKEN_JSON" ]; then echo "$YT_TOKEN_JSON" > yt_token.json; fi

      - name: Generate shorts
        run: python src/main.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_REFRESH_TOKEN:        ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:            ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:        ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN:                    ${{ secrets.HF_TOKEN }}
          GH_TOKEN:                    ${{ github.token }}
          SPREADSHEET_ID:              '1d-GID8JCIrw89ygIKXfsyT9Fe0qtxxmsUaKORuDliOM'
          # Scheduled runs can't pass inputs, so the cron slot decides the campaign.
          CAMPAIGN: ${{ github.event.inputs.campaign || (github.event.schedule == '42 16 * * *' && 'milkxp') || (github.event.schedule == '42 17 * * *' && 'milkxp') || (github.event.schedule == '57 17 * * *' && 'markmanson') || (github.event.schedule == '57 18 * * *' && 'unpacked') || (github.event.schedule == '27 20 * * *' && 'ladbible') || (github.event.schedule == '12 21 * * *' && 'ladbible') || 'markmanson' }}
          VIDEO_FILE_ID:               ${{ github.event.inputs.video_file_id }}
          EPISODE_NAME:                ${{ github.event.inputs.episode_name }}
          # Campaigns with two daily slots: pin each cron to its own slot.
          PUBLISH_SLOT:                ${{ (github.event.schedule == '42 16 * * *' && '18:45') || (github.event.schedule == '42 17 * * *' && '19:45') || (github.event.schedule == '27 20 * * *' && '22:30') || (github.event.schedule == '12 21 * * *' && '23:15') || '' }}
          WHISPER_MODEL:               ${{ github.event.inputs.whisper_model || 'medium' }}
          # talk / podcast campaigns try this first, WHISPER_MODEL is the fallback (campaigns.whisper_models)
          WHISPER_TALK_MODEL:          'medium.en'
          # remotion/ was installed above (or that failed): never npm ci mid-run, fall back to ASS
          REMOTION_AUTO_INSTALL:       '0'
          VIDEOS_FOLDER_ID:  '1bIFaNpfBy1Bp9R14T22EV-hMsYYrLeTS'
          SHORTS_FOLDER_ID:  '1kzFXWZQu8QQVtZKeAVvSgHcLaRFfK6tg'
          ARCHIVE_FOLDER_ID: '1nHZCaWO_KvkV52TekkF8ecC5JtIlXqJj'
