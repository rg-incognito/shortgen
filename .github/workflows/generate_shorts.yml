name: Generate Shorts

on:
  workflow_dispatch:
    inputs:
      video_file_id:
        description: 'Drive File ID — leave blank to auto-pick from videos/ folder'
        required: false
        default: ''
      episode_name:
        description: 'Episode name (e.g. friends_s01e01) — auto-detected if blank'
        required: false
        default: ''
      whisper_model:
        description: 'Whisper model: base (fast) | small (accurate) | medium (best)'
        required: false
        default: 'small'

# Required GitHub Secrets:
#   GOOGLE_SERVICE_ACCOUNT_JSON  — full JSON of the service account key file
#   GEMINI_API_KEY               — from aistudio.google.com/app/apikey
#   SPREADSHEET_ID               — ID from the ShortGen Tracker sheet URL

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/bin/ffmpeg
          key: ffmpeg-ubuntu-latest

      - name: Install ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-${{ github.event.inputs.whisper_model || 'small' }}

      - name: Pre-download Whisper model
        run: |
          python -c "
          from faster_whisper import WhisperModel
          import os
          model = os.environ.get('WHISPER_MODEL', 'small')
          print(f'Downloading whisper-{model}...')
          WhisperModel(model, device='cpu', compute_type='int8')
          print('Done.')
          "
        env:
          WHISPER_MODEL: ${{ github.event.inputs.whisper_model || 'small' }}

      - name: Generate shorts
        run: python src/main.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_REFRESH_TOKEN:        ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:            ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:        ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID:              '1d-GID8JCIrw89ygIKXfsyT9Fe0qtxxmsUaKORuDliOM'
          VIDEO_FILE_ID:               ${{ github.event.inputs.video_file_id }}
          EPISODE_NAME:                ${{ github.event.inputs.episode_name }}
          WHISPER_MODEL:               ${{ github.event.inputs.whisper_model }}
          # Folder IDs — hardcoded, change here if you restructure Drive
          VIDEOS_FOLDER_ID:  '1bIFaNpfBy1Bp9R14T22EV-hMsYYrLeTS'
          SHORTS_FOLDER_ID:  '1kzFXWZQu8QQVtZKeAVvSgHcLaRFfK6tg'
          ARCHIVE_FOLDER_ID: '1nHZCaWO_KvkV52TekkF8ecC5JtIlXqJj'
